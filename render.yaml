# Render Blueprint: API + background worker + Redis (Key Value), all in Singapore (closest Render region to India).
# MongoDB is MongoDB Atlas (create it first, region AWS Mumbai ap-south-1) and documents go to S3 Mumbai,
# so stored business data stays in India. Render → New → Blueprint → pick this repository.
# Values marked "sync: false" are asked for once in the Render dashboard (never commit them).
envVarGroups:
  - name: insurance-shared
    envVars:
      - key: NODE_ENV
        value: staging # switch to production once SMS, WhatsApp, email and S3 are configured
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: 1
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: FILE_URL_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock # razorpay once the Razorpay keys are added
      - key: STORAGE_DRIVER
        value: local # s3 once the bucket is ready (local files are lost on every deploy)
      - key: API_DOCS_ENABLED
        value: false

services:
  - type: web
    name: insurance-api
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /ready
    envVars:
      - fromGroup: insurance-shared
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: insurance-redis, property: connectionString }
      - key: PUBLIC_BASE_URL
        sync: false # https://api.yourdomain.in (or the onrender.com address)
      - key: CORS_ORIGINS
        sync: false # https://admin.yourdomain.in
      - key: OTP_FIXED_CODE
        sync: false # staging only: 6 digits for testers; leave empty for real OTPs

  - type: worker
    name: insurance-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerCommand: node dist/worker.js
    envVars:
      - fromGroup: insurance-shared
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: insurance-redis, property: connectionString }
      - key: PUBLIC_BASE_URL
        sync: false

  - type: keyvalue
    name: insurance-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction # required by BullMQ: queued jobs must never be evicted
    ipAllowList: [] # reachable only from the services above (private network)
